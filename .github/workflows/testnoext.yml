name: tests_noextras

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  workflow_dispatch:
  pull_request:
    branches:
      - develop

env:
  UV_PYTHON: "3.11"

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install just
      uses: extractions/setup-just@v3

    - name: Install dependencies
      run: |
        uv sync --no-dev --cache-dir .uv_cache

    - name: Run simple command
      run: |
        uv run energon --version
